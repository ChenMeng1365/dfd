<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dfd · 单页应用集成门户</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
<style>
  :root {
    --bg: #0f1115;
    --bg-soft: #171a21;
    --card: #1c2029;
    --card-hover: #232936;
    --border: #2a3040;
    --text: #e6e9f0;
    --text-dim: #9aa3b2;
    --accent: #4f8cff;
    --accent-soft: rgba(79, 140, 255, 0.12);
    --danger: #e05252;
    --ok: #3dbb7a;
    --warn: #e0a33c;
    --radius: 14px;
    --shadow: 0 6px 24px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(79,140,255,0.10), transparent 60%),
      radial-gradient(900px 400px at 90% 0%, rgba(120,80,255,0.08), transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ---------- 头部 ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 22px;
    background: rgba(15,17,21,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .logo { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; white-space: nowrap; }
  .logo b { color: var(--accent); }
  .search-box { flex: 1; max-width: 420px; position: relative; }
  .search-box input {
    width: 100%;
    padding: 8px 14px 8px 36px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 14px; }
  .header-info { margin-left: auto; font-size: 13px; color: var(--text-dim); white-space: nowrap; }
  .refresh-btn {
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid rgba(79,140,255,0.4);
    padding: 6px 14px; border-radius: 999px; cursor: pointer;
    font-size: 13px; transition: background .15s;
  }
  .refresh-btn:hover { background: rgba(79,140,255,0.22); }
  .refresh-btn:disabled { opacity: .5; cursor: default; }

  /* ---------- 标签栏 ---------- */
  .tags-bar {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 12px 22px 4px;
  }
  .tag {
    padding: 5px 14px; border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text-dim);
    font-size: 13px; cursor: pointer;
    transition: all .15s;
    user-select: none;
  }
  .tag:hover { color: var(--text); border-color: var(--text-dim); }
  .tag.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---------- 主区 ---------- */
  main { padding: 18px 22px 40px; }

  .section {
    margin-bottom: 30px;
  }
  .section-head {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 14px;
  }
  .section-title {
    font-size: 16px; font-weight: 700; letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title .count { font-size: 12px; color: var(--text-dim); font-weight: 400; }
  .probe-btn {
    margin-left: auto;
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid rgba(79,140,255,0.4);
    padding: 6px 14px; border-radius: 999px; cursor: pointer;
    font-size: 13px; transition: background .15s;
  }
  .probe-btn:hover { background: rgba(79,140,255,0.22); }
  .probe-btn:disabled { opacity: .5; cursor: default; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    position: relative;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    cursor: pointer;
    transition: transform .15s, border-color .15s, background .15s, box-shadow .15s;
    display: flex; flex-direction: column; gap: 10px;
    overflow: hidden;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    background: var(--card-hover);
    box-shadow: var(--shadow);
  }
  .card-head { display: flex; align-items: center; gap: 12px; }
  .card-icon {
    width: 44px; height: 44px; flex-shrink: 0;
    border-radius: 10px;
    background: var(--bg-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .card-icon img { width: 100%; height: 100%; object-fit: cover; }
  .card-title { font-size: 16px; font-weight: 600; line-height: 1.3; }
  .card-desc {
    font-size: 13px; color: var(--text-dim); line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    flex: 1;
  }
  .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .card-tags span {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
  }
  .card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-dim); }
  .card-badge {
    position: absolute; top: 12px; right: 12px;
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: rgba(224,82,82,0.15); color: var(--danger);
    border: 1px solid rgba(224,82,82,0.3);
  }

  /* ---------- 服务卡片 ---------- */
  .svc-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    display: flex; flex-direction: column; gap: 10px;
    transition: border-color .15s, background .15s;
  }
  .svc-card:hover { border-color: var(--border); background: var(--card-hover); }
  .svc-head { display: flex; align-items: center; gap: 12px; }
  .svc-name { font-size: 15px; font-weight: 600; }
  .svc-desc { font-size: 12px; color: var(--text-dim); line-height: 1.5; min-height: 18px; }

  .status-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.online { background: var(--ok); box-shadow: 0 0 8px rgba(61,187,122,0.8); }
  .status-dot.offline { background: var(--danger); box-shadow: 0 0 8px rgba(224,82,82,0.8); }
  .status-dot.unknown { background: var(--warn); box-shadow: 0 0 8px rgba(224,163,60,0.8); }
  .status-text.online { color: var(--ok); }
  .status-text.offline { color: var(--danger); }
  .status-text.unknown { color: var(--warn); }
  .svc-url { font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .svc-actions { display: flex; gap: 8px; margin-top: 2px; }
  .svc-btn {
    padding: 5px 12px; border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-soft); color: var(--text);
    font-size: 12px; cursor: pointer;
    transition: all .15s;
    text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
  }
  .svc-btn:hover { background: var(--card-hover); border-color: var(--text-dim); }
  .svc-btn.primary { background: var(--accent-soft); color: var(--accent); border-color: rgba(79,140,255,0.4); }
  .svc-btn.primary:hover { background: rgba(79,140,255,0.22); }
  .svc-btn:disabled { opacity: .5; cursor: default; }
  .svc-btn.online { color: var(--ok); border-color: rgba(61,187,122,0.4); }

  .empty {
    grid-column: 1 / -1;
    text-align: center; padding: 40px 20px;
    color: var(--text-dim);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }
  .empty code { background: var(--bg-soft); padding: 2px 6px; border-radius: 4px; color: var(--accent); }

  /* ---------- 配置弹窗 ---------- */
  .modal-mask {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.55);
    display: none; align-items: center; justify-content: center;
  }
  .modal-mask.open { display: flex; }
  .modal {
    width: min(460px, 92vw);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow);
  }
  .modal h3 { font-size: 16px; margin-bottom: 16px; }
  .modal label { display: block; font-size: 13px; color: var(--text-dim); margin: 12px 0 6px; }
  .modal input[type="text"] {
    width: 100%;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .modal input[type="text"]:focus { border-color: var(--accent); }
  .modal .hint { font-size: 12px; color: var(--text-dim); margin-top: 6px; line-height: 1.5; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .modal-btn {
    padding: 7px 18px; border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-soft); color: var(--text);
    font-size: 13px; cursor: pointer;
  }
  .modal-btn:hover { background: var(--card-hover); }
  .modal-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .modal-msg { font-size: 12px; margin-top: 10px; min-height: 16px; }
  .modal-msg.err { color: var(--danger); }
  .modal-msg.ok { color: var(--ok); }

  /* ---------- 项目配置面板 ---------- */
  .config-panel-mask {
    position: fixed; inset: 0; z-index: 110;
    background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center;
  }
  .config-panel-mask.open { display: flex; }
  .config-panel {
    width: min(820px, 94vw);
    max-height: 88vh;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex; flex-direction: column;
    box-shadow: var(--shadow);
  }
  .config-panel-head {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
  }
  .config-panel-head h3 { font-size: 16px; }
  .config-panel-head .close-btn {
    margin-left: auto; background: none; border: none;
    color: var(--text-dim); font-size: 20px; cursor: pointer;
    padding: 4px 8px; border-radius: 6px;
  }
  .config-panel-head .close-btn:hover { color: var(--text); background: var(--bg-soft); }
  .config-panel-body {
    padding: 18px 22px;
    overflow-y: auto;
    flex: 1;
  }
  .config-panel-foot {
    padding: 14px 22px;
    border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 10px;
  }

  /* 配置卡片特殊样式 */
  .svc-card.config-card {
    border-color: rgba(79,140,255,0.4);
    background: linear-gradient(135deg, rgba(79,140,255,0.08), var(--card));
    cursor: pointer;
  }
  .svc-card.config-card:hover {
    border-color: var(--accent);
    background: linear-gradient(135deg, rgba(79,140,255,0.15), var(--card-hover));
  }
  .config-badge {
    margin-left: auto;
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
  }
  .ext-badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: rgba(224,163,60,0.15); color: var(--warn);
    border: 1px solid rgba(224,163,60,0.3);
    margin-left: 8px; vertical-align: middle; white-space: nowrap;
  }

  /* 外部项目列表 */
  .ext-list { display: flex; flex-direction: column; gap: 10px; }
  .ext-item {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    background: var(--bg-soft);
    display: flex; flex-direction: column; gap: 8px;
  }
  .ext-item-head { display: flex; align-items: center; gap: 10px; }
  .ext-item-name { font-size: 15px; font-weight: 600; }
  .ext-item-meta { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
  .ext-item-meta code { background: var(--card); padding: 1px 6px; border-radius: 4px; color: var(--accent); }
  .ext-item-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .ext-empty {
    text-align: center; padding: 30px 20px;
    color: var(--text-dim);
    border: 1px dashed var(--border); border-radius: 10px;
  }

  /* 外部项目编辑表单 */
  .ext-form {
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
    background: rgba(79,140,255,0.05);
    display: none;
  }
  .ext-form.open { display: block; }
  .ext-form h4 { font-size: 14px; margin-bottom: 12px; }
  .ext-form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .ext-form-row > div { flex: 1; min-width: 200px; }
  .ext-form label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .ext-form input[type="text"] {
    width: 100%; padding: 7px 10px;
    border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg-soft); color: var(--text); font-size: 13px; outline: none;
  }
  .ext-form input[type="text"]:focus { border-color: var(--accent); }
  .ext-form textarea {
    width: 100%; min-height: 130px; padding: 8px 10px;
    border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg-soft); color: var(--text);
    font-family: Consolas, "Courier New", monospace;
    font-size: 12.5px; line-height: 1.6; outline: none;
    resize: vertical;
  }
  .ext-form textarea:focus { border-color: var(--accent); }
  .form-hint { font-size: 12px; color: var(--text-dim); margin-top: 5px; line-height: 1.5; }
  .svc-btn.danger { color: var(--danger); border-color: rgba(224,82,82,0.35); }
  .svc-btn.danger:hover { background: rgba(224,82,82,0.12); border-color: rgba(224,82,82,0.55); }
  .ext-badge.script { background: rgba(61,187,122,0.12); color: var(--ok); border: 1px solid rgba(61,187,122,0.3); }
  .ext-form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .ext-form-msg { font-size: 12px; margin-top: 6px; min-height: 14px; color: var(--danger); }
  .ext-form-msg.ok { color: var(--ok); }

  /* 加载提示 */
  .loading {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 40px; color: var(--text-dim); font-size: 14px;
  }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    .header-info { display: none; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">dfd <b>·</b> 应用门户</div>
  <div class="search-box">
    <span class="icon">🔍</span>
    <input id="search" type="text" placeholder="搜索应用…" autocomplete="off">
  </div>
  <button id="refresh" class="refresh-btn" title="重新扫描 projects/services 目录">↻ 刷新</button>
  <div class="header-info" id="count-info"></div>
</header>

<div class="tags-bar" id="tags-bar"></div>

<main>
  <!-- 服务区：需自行启动的服务 -->
  <section class="section">
    <div class="section-head">
      <div class="section-title">⚙️ 服务 <span class="count" id="svc-count"></span></div>
      <button id="probe" class="probe-btn" title="探测所有服务状态">🔍 探测</button>
    </div>
    <div class="grid" id="svc-grid"></div>
  </section>

  <!-- 项目区 -->
  <section class="section">
    <div class="section-head">
      <div class="section-title">🧩 应用 <span class="count" id="app-count"></span></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<!-- 服务配置弹窗 -->
<div class="modal-mask" id="modal">
  <div class="modal">
    <h3 id="modal-title">配置服务</h3>
    <label for="cfg-name">显示名称</label>
    <input type="text" id="cfg-name" placeholder="服务显示名称">
    <label for="cfg-url">首页地址（用于探测与打开）</label>
    <input type="text" id="cfg-url" placeholder="http://127.0.0.1:8080/">
    <div class="hint">探测时会请求该地址判断服务是否在线；留空则不探测。</div>
    <label for="cfg-script">启动脚本（services/&lt;名称&gt;/ 目录下）</label>
    <input type="text" id="cfg-script" placeholder="start.bat">
    <div class="modal-msg" id="cfg-msg"></div>
    <div class="modal-actions">
      <button class="modal-btn" id="cfg-cancel">取消</button>
      <button class="modal-btn primary" id="cfg-save">保存</button>
    </div>
  </div>
</div>

<!-- 项目配置面板 -->
<div class="config-panel-mask" id="config-panel-mask">
  <div class="config-panel">
    <div class="config-panel-head">
      <h3>🎛️ 项目配置</h3>
      <button class="close-btn" id="cp-close">✕</button>
    </div>
    <div class="config-panel-body">
      <div class="ext-form" id="ext-form">
        <h4 id="ext-form-title">新增外部项目</h4>
        <div class="ext-form-row">
          <div>
            <label>显示名称 *</label>
            <input type="text" id="ext-name" placeholder="如：我的项目">
          </div>
          <div style="flex:0 0 80px;">
            <label>图标</label>
            <input type="text" id="ext-icon" placeholder="📦" maxlength="4">
          </div>
        </div>
        <div class="ext-form-row">
          <div>
            <label>项目路径 *</label>
            <input type="text" id="ext-path" placeholder="E:\workspace\my-project">
          </div>
          <div style="flex:0 0 160px;">
            <label>启动脚本</label>
            <input type="text" id="ext-script" placeholder="start.bat">
          </div>
        </div>
        <div class="ext-form-row">
          <div>
            <label>首页地址（用于探测状态）</label>
            <input type="text" id="ext-url" placeholder="http://127.0.0.1:3000/">
          </div>
        </div>
        <div class="ext-form-row">
          <div>
            <label>可执行脚本（可选 · 后台隐藏运行，支持停止）</label>
            <textarea id="ext-inline-script" spellcheck="false" placeholder="例如：
node server.js
python app.py

在上方「项目路径」下后台执行（无窗口），输出记录到 dfd/runtime/ 下日志；
填写后卡片「▶ 启动」执行此脚本，并出现「⏹ 停止」按钮可终止进程；
留空则按「启动脚本」方式在新窗口运行。"></textarea>
            <div class="form-hint">多行命令将按批处理方式执行；服务请保持前台运行（勿用 start 另开进程），停止时优先按进程树终止，必要时按首页端口兑底。</div>
          </div>
        </div>
        <div class="ext-form-row">
          <div>
            <label>描述</label>
            <input type="text" id="ext-desc" placeholder="项目描述（可选）">
          </div>
        </div>
        <div class="ext-form-msg" id="ext-form-msg"></div>
        <div class="ext-form-actions">
          <button class="modal-btn" id="ext-form-cancel">取消</button>
          <button class="modal-btn primary" id="ext-form-save">保存</button>
        </div>
      </div>
      <div class="ext-list" id="ext-list"></div>
    </div>
    <div class="config-panel-foot">
      <button class="modal-btn primary" id="cp-add">+ 新增项目</button>
    </div>
  </div>
</div>

<script>
'use strict';

const grid = document.getElementById('grid');
const svcGrid = document.getElementById('svc-grid');
const search = document.getElementById('search');
const tagsBar = document.getElementById('tags-bar');
const countInfo = document.getElementById('count-info');
const refreshBtn = document.getElementById('refresh');
const probeBtn = document.getElementById('probe');

let projects = [];
let services = [];
let activeTag = 'all';
let editingService = null;

/* ---------- 通用 ---------- */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function iconHtml(icon) {
  if (icon && icon.type === 'image') {
    return `<img src="${escapeHtml(icon.value)}" alt="">`;
  }
  return escapeHtml((icon && icon.value) || '📦');
}

async function api(url, options) {
  const res = await fetch(url, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `请求失败 (${res.status})`);
  return data;
}

/* ---------- 项目渲染 ---------- */
function allTags() {
  const set = new Set();
  projects.forEach(p => (p.tags || []).forEach(t => set.add(t)));
  return [...set].sort();
}

function renderTags() {
  const tags = allTags();
  let html = `<span class="tag ${activeClass('all')}" data-tag="all">全部</span>`;
  tags.forEach(t => {
    html += `<span class="tag ${activeClass(t)}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</span>`;
  });
  tagsBar.innerHTML = html;
}

function activeClass(tag) { return tag === activeTag ? 'active' : ''; }

function filtered() {
  const q = search.value.trim().toLowerCase();
  return projects.filter(p => {
    if (activeTag !== 'all' && !(p.tags || []).includes(activeTag)) return false;
    if (!q) return true;
    return (p.title + ' ' + p.name + ' ' + (p.description || '') + ' ' + (p.tags || []).join(' '))
      .toLowerCase().includes(q);
  });
}

function renderGrid() {
  const list = filtered();
  document.getElementById('app-count').textContent = `${list.length} / ${projects.length}`;

  if (!projects.length) {
    grid.innerHTML = `<div class="empty">📁 projects 目录为空<br><br>
      将单页项目文件夹放入 <code>projects/</code>，点击右上角 <b>↻ 刷新</b> 即可自动集成。</div>`;
    return;
  }
  if (!list.length) {
    grid.innerHTML = `<div class="empty">🔍 没有匹配的应用，换个关键词或标签试试</div>`;
    return;
  }

  grid.innerHTML = list.map(p => `
    <a class="card" href="${escapeHtml(p.url)}" target="_blank" rel="noopener">
      ${p.entryExists ? '' : '<span class="card-badge">缺少入口文件</span>'}
      <div class="card-head">
        <div class="card-icon">${iconHtml(p.icon)}</div>
        <div class="card-title">${escapeHtml(p.title)}</div>
      </div>
      <div class="card-desc">${escapeHtml(p.description || '暂无描述')}</div>
      ${p.tags && p.tags.length ? `<div class="card-tags">${p.tags.map(t => `<span>${escapeHtml(t)}</span>`).join('')}</div>` : ''}
      <div class="card-meta">
        <span>${escapeHtml(p.name)}</span>
        <span>${escapeHtml(p.entry)}</span>
      </div>
    </a>`).join('');
}

/* ---------- 服务渲染 ---------- */
function svcStatusHtml(s) {
  const st = s.status || {};
  let dot, text;
  if (!s.url) {
    dot = 'unknown'; text = '未配置地址';
  } else if (st.online) {
    dot = 'on'; text = `在线 · ${st.statusCode || ''} · ${st.latencyMs}ms`;
  } else {
    dot = 'offline'; text = `离线 · ${st.error || ''}`;
  }
  return `<div class="status-row">
    <span class="status-dot ${dot}"></span>
    <span class="status-text ${dot}">${escapeHtml(text)}</span>
  </div>`;
}

function renderServices() {
  document.getElementById('svc-count').textContent = `${services.length} 个`;

  if (!services.length) {
    svcGrid.innerHTML = `<div class="empty">⚙️ services 目录为空<br><br>
      将需要自行启动的服务（含 <code>start.bat</code>）放入 <code>services/</code>，即可在此探测与启动。</div>`;
    return;
  }

  svcGrid.innerHTML = services.map(s => {
    // 虚拟「项目配置」服务：特殊卡片
    if (s.isConfig) {
      return `
      <div class="svc-card config-card" data-act="open-config-panel" data-name="${escapeHtml(s.name)}">
        <div class="svc-head">
          <div class="card-icon">${iconHtml(s.icon)}</div>
          <div class="svc-name">${escapeHtml(s.title)}</div>
          <span class="config-badge">外部项目</span>
        </div>
        <div class="svc-desc">${escapeHtml(s.description || '管理 dfd 项目外的服务启动配置')}</div>
        ${svcStatusHtml(s)}
        <div class="svc-url">点击打开配置面板</div>
        <div class="svc-actions">
          <button class="svc-btn primary" data-act="open-config-panel" data-name="${escapeHtml(s.name)}" title="打开配置面板">⚙ 打开配置面板</button>
        </div>
      </div>`;
    }
    return `
    <div class="svc-card">
      <div class="svc-head">
        <div class="card-icon">${iconHtml(s.icon)}</div>
        <div class="svc-name">${escapeHtml(s.title)}${s.isExternal ? '<span class="ext-badge">外部服务</span>' : ''}</div>
      </div>
      <div class="svc-desc">${escapeHtml(s.description || '')}</div>
      ${svcStatusHtml(s)}
      <div class="svc-url" title="${escapeHtml(s.url || '')}">${escapeHtml(s.url || '未配置首页地址')}</div>
      <div class="svc-actions">
        <button class="svc-btn ${s.status && s.status.online ? 'online' : ''}" data-act="open" data-name="${escapeHtml(s.name)}" ${s.url ? `data-url="${escapeHtml(s.url)}"` : 'disabled title="未配置首页地址"'} title="打开">↗</button>
        ${s.isExternal
          ? `<button class="svc-btn" data-act="open-folder-ext" data-ext-id="${escapeHtml(s.extId)}" title="打开文件夹">📂</button>
             <button class="svc-btn primary" data-act="start-ext" data-ext-id="${escapeHtml(s.extId)}" ${s.startExists ? '' : 'disabled title="缺少启动脚本"'} title="${s.hasScript ? '后台隐藏执行内联脚本' : '运行启动脚本（新窗口）'}">▶</button>
             ${s.hasScript ? `<button class="svc-btn danger" data-act="stop-ext" data-ext-id="${escapeHtml(s.extId)}" title="终止该脚本启动的后台进程">⏹</button>` : ''}
             <button class="svc-btn" data-act="edit-ext" data-ext-id="${escapeHtml(s.extId)}" title="编辑">✏</button>`
          : `<button class="svc-btn" data-act="open-folder" data-name="${escapeHtml(s.name)}" title="打开文件夹">📂</button>
             <button class="svc-btn primary" data-act="start" data-name="${escapeHtml(s.name)}" ${s.startExists ? '' : 'disabled title="缺少启动脚本"'} title="启动">▶</button>
             <button class="svc-btn" data-act="config" data-name="${escapeHtml(s.name)}" title="配置">⚙</button>`
        }
      </div>
    </div>`;
  }).join('');
}

svcGrid.addEventListener('click', async e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;

  // ---- 外部服务操作（使用 extId，需在 svc 查找之前处理）----
  if (btn.dataset.act === 'start-ext') {
    const extId = btn.dataset.extId;
    btn.disabled = true;
    btn.textContent = '⏳';
    try {
      await api(`/api/external-services/${encodeURIComponent(extId)}/start`, { method: 'POST' });
      btn.textContent = '✔';
      await probeServices();
    } catch (err) {
      btn.textContent = '✖';
      alert('启动失败：' + err.message);
    }
    setTimeout(() => { btn.disabled = false; btn.textContent = '▶'; }, 1500);
    return;
  }
  if (btn.dataset.act === 'stop-ext') {
    const extId = btn.dataset.extId;
    btn.disabled = true;
    btn.textContent = '⏳';
    try {
      await api(`/api/external-services/${encodeURIComponent(extId)}/stop`, { method: 'POST' });
      btn.textContent = '✔';
      await probeServices();
    } catch (err) {
      btn.textContent = '✖';
      alert('停止失败：' + err.message);
    }
    setTimeout(() => { btn.disabled = false; btn.textContent = '⏹'; }, 1500);
    return;
  }
  if (btn.dataset.act === 'open-folder-ext') {
    const extId = btn.dataset.extId;
    try {
      const res = await api(`/api/external-services/${encodeURIComponent(extId)}/open-folder`, { method: 'POST' });
      if (!res.ok) alert('打开文件夹失败：' + (res.error || '未知错误'));
    } catch (err) {
      alert('打开文件夹失败：' + err.message);
    }
    return;
  }
  if (btn.dataset.act === 'edit-ext') {
    openConfigPanel(btn.dataset.extId);
    return;
  }

  // ---- 常规服务操作 ----
  const name = btn.dataset.name;
  const svc = services.find(s => s.name === name);
  if (!svc) return;

  if (btn.dataset.act === 'open-config-panel') {
    openConfigPanel();
    return;
  }
  if (btn.dataset.act === 'config') {
    openConfig(svc);
    return;
  }
  if (btn.dataset.act === 'open') {
    if (!svc.url) { alert('未配置首页地址，请点击 ⚙ 配置'); return; }
    window.open(svc.url, '_blank', 'noopener');
    return;
  }
  if (btn.dataset.act === 'open-folder') {
    try {
      const res = await api(`/api/services/${encodeURIComponent(name)}/open-folder`, { method: 'POST' });
      if (!res.ok) alert('打开文件夹失败：' + (res.error || '未知错误'));
    } catch (err) {
      alert('打开文件夹失败：' + err.message);
    }
    return;
  }
  if (btn.dataset.act === 'start') {
    btn.disabled = true;
    btn.textContent = '⏳';
    try {
      const res = await api(`/api/services/${encodeURIComponent(name)}/start`, { method: 'POST' });
      btn.textContent = '✔';
      await probeServices();
    } catch (err) {
      btn.textContent = '✖';
      alert('启动失败：' + err.message);
    }
    setTimeout(() => { btn.disabled = false; btn.textContent = '▶'; }, 1500);
  }
});

/* ---------- 探测 ---------- */
async function probeServices() {
  probeBtn.disabled = true;
  probeBtn.textContent = '探测中…';
  try {
    const data = await api('/api/services');
    services = data.services || [];
  } catch (err) {
    services = [];
    svcGrid.innerHTML = `<div class="empty">⚠️ 探测失败：${escapeHtml(String(err.message || err))}</div>`;
  }
  renderServices();
  probeBtn.textContent = '🔍 探测';
  probeBtn.disabled = false;
}

/* ---------- 配置弹窗 ---------- */
const modal = document.getElementById('modal');
const cfgName = document.getElementById('cfg-name');
const cfgUrl = document.getElementById('cfg-url');
const cfgScript = document.getElementById('cfg-script');
const cfgMsg = document.getElementById('cfg-msg');

function openConfig(svc) {
  editingService = svc;
  document.getElementById('modal-title').textContent = `配置 · ${svc.title}`;
  cfgName.value = svc.title;
  cfgUrl.value = svc.url || '';
  cfgScript.value = svc.startScript || 'start.bat';
  cfgMsg.textContent = '';
  cfgMsg.className = 'modal-msg';
  modal.classList.add('open');
}

function closeConfig() {
  modal.classList.remove('open');
  editingService = null;
}

document.getElementById('cfg-cancel').addEventListener('click', closeConfig);
modal.addEventListener('click', e => { if (e.target === modal) closeConfig(); });

document.getElementById('cfg-save').addEventListener('click', async () => {
  if (!editingService) return;
  cfgMsg.textContent = '保存中…';
  cfgMsg.className = 'modal-msg';
  try {
    await api(`/api/services/${encodeURIComponent(editingService.name)}/config`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: cfgName.value.trim(),
        url: cfgUrl.value.trim(),
        startScript: cfgScript.value.trim() || 'start.bat',
      }),
    });
    cfgMsg.textContent = '已保存';
    cfgMsg.className = 'modal-msg ok';
    closeConfig();
    await probeServices();
  } catch (err) {
    cfgMsg.textContent = '保存失败：' + err.message;
    cfgMsg.className = 'modal-msg err';
  }
});

/* ---------- 项目配置面板（外部服务管理） ---------- */
const configPanelMask = document.getElementById('config-panel-mask');
const extListEl = document.getElementById('ext-list');
const extForm = document.getElementById('ext-form');
const extFormTitle = document.getElementById('ext-form-title');
const extFormMsg = document.getElementById('ext-form-msg');
let extServices = [];
let editingExtId = null;

async function openConfigPanel(editExtId) {
  configPanelMask.classList.add('open');
  await loadExtServices();
  if (editExtId) {
    const item = extServices.find(s => s.id === editExtId);
    if (item) openExtForm(item);
  }
}

function closeConfigPanel() {
  configPanelMask.classList.remove('open');
  closeExtForm();
}

function closeExtForm() {
  extForm.classList.remove('open');
  editingExtId = null;
  extFormMsg.textContent = '';
  extFormMsg.className = 'ext-form-msg';
  document.getElementById('ext-name').value = '';
  document.getElementById('ext-icon').value = '';
  document.getElementById('ext-path').value = '';
  document.getElementById('ext-script').value = 'start.bat';
  document.getElementById('ext-url').value = '';
  document.getElementById('ext-inline-script').value = '';
  document.getElementById('ext-desc').value = '';
}

async function loadExtServices() {
  extListEl.innerHTML = `<div class="loading"><span class="spinner"></span>加载中…</div>`;
  try {
    const data = await api('/api/external-services');
    extServices = data.services || [];
    renderExtList();
  } catch (err) {
    extListEl.innerHTML = `<div class="ext-empty">⚠️ 加载失败：${escapeHtml(String(err.message || err))}</div>`;
  }
}

function renderExtList() {
  if (!extServices.length) {
    extListEl.innerHTML = `<div class="ext-empty">暂无外部项目配置<br>点击下方「+ 新增项目」添加</div>`;
    return;
  }
  extListEl.innerHTML = extServices.map(s => {
    const st = s.status || {};
    let dot, stText;
    if (!s.url) { dot = 'unknown'; stText = '未配置地址'; }
    else if (st.online) { dot = 'online'; stText = `在线 · ${st.latencyMs}ms`; }
    else { dot = 'offline'; stText = `离线 · ${st.error || ''}`; }
    return `
    <div class="ext-item">
      <div class="ext-item-head">
        <span style="font-size:20px;">${escapeHtml(s.icon || '📦')}</span>
        <span class="ext-item-name">${escapeHtml(s.name)}</span>
        <span class="status-dot ${dot}" style="margin-left:auto;"></span>
        <span class="status-text ${dot}" style="font-size:12px;">${escapeHtml(stText)}</span>
      </div>
      <div class="ext-item-meta">
        路径: <code>${escapeHtml(s.path)}</code><br>
        ${s.hasScript
          ? `可执行脚本: <code>内联 · 后台隐藏运行</code>${s.running ? ' <span class="ext-badge script">托管运行中</span>' : ''}`
          : `启动脚本: <code>${escapeHtml(s.startScript)}</code>`}
        ${s.url ? `<br>首页: <code>${escapeHtml(s.url)}</code>` : ''}
        ${s.description ? `<br>${escapeHtml(s.description)}` : ''}
      </div>
      <div class="ext-item-actions">
        <button class="svc-btn primary" data-ext-act="start" data-id="${escapeHtml(s.id)}" ${s.startExists ? '' : 'disabled title="缺少启动脚本"'} title="${s.hasScript ? '后台隐藏执行内联脚本' : '运行启动脚本（新窗口）'}">▶ 启动</button>
        ${s.hasScript ? `<button class="svc-btn danger" data-ext-act="stop" data-id="${escapeHtml(s.id)}" title="终止该脚本启动的后台进程">⏹ 停止</button>` : ''}
        <button class="svc-btn" data-ext-act="open-folder" data-id="${escapeHtml(s.id)}">📂 目录</button>
        <button class="svc-btn" data-ext-act="edit" data-id="${escapeHtml(s.id)}">✏ 编辑</button>
        <button class="svc-btn" data-ext-act="delete" data-id="${escapeHtml(s.id)}" style="color:var(--danger);border-color:rgba(224,82,82,0.3);">🗑 删除</button>
      </div>
    </div>`;
  }).join('');
}

extListEl.addEventListener('click', async e => {
  const btn = e.target.closest('[data-ext-act]');
  if (!btn) return;
  const id = btn.dataset.id;
  const act = btn.dataset.extAct;
  const item = extServices.find(s => s.id === id);
  if (!item) return;

  if (act === 'start') {
    btn.disabled = true;
    btn.textContent = '⏳ 启动中…';
    try {
      await api(`/api/external-services/${encodeURIComponent(id)}/start`, { method: 'POST' });
      btn.textContent = '✔ 已发送';
      await loadExtServices();
    } catch (err) {
      btn.textContent = '✖ 失败';
      alert('启动失败：' + err.message);
    }
    setTimeout(() => { btn.disabled = false; btn.textContent = '▶ 启动'; }, 2000);
    return;
  }
  if (act === 'stop') {
    btn.disabled = true;
    btn.textContent = '⏳ 停止中…';
    try {
      await api(`/api/external-services/${encodeURIComponent(id)}/stop`, { method: 'POST' });
      btn.textContent = '✔ 已停止';
    } catch (err) {
      btn.textContent = '✖ 失败';
      alert('停止失败：' + err.message);
    }
    await loadExtServices();
    await probeServices();
    setTimeout(() => { btn.disabled = false; btn.textContent = '⏹ 停止'; }, 2000);
    return;
  }
  if (act === 'open-folder') {
    try {
      const res = await api(`/api/external-services/${encodeURIComponent(id)}/open-folder`, { method: 'POST' });
      if (!res.ok) alert('打开目录失败：' + (res.error || '未知错误'));
    } catch (err) { alert('打开目录失败：' + err.message); }
    return;
  }
  if (act === 'edit') { openExtForm(item); return; }
  if (act === 'delete') {
    if (!confirm(`确认删除「${item.name}」的配置？\n（不会删除实际项目文件，仅删除此处的启动配置）`)) return;
    try {
      await api(`/api/external-services/${encodeURIComponent(id)}`, { method: 'DELETE' });
      await loadExtServices();
      await probeServices();
    } catch (err) { alert('删除失败：' + err.message); }
    return;
  }
});

function openExtForm(item) {
  editingExtId = item ? item.id : null;
  extFormTitle.textContent = item ? '编辑外部项目' : '新增外部项目';
  document.getElementById('ext-name').value = item ? item.name : '';
  document.getElementById('ext-icon').value = item ? (item.icon || '') : '';
  document.getElementById('ext-path').value = item ? item.path : '';
  document.getElementById('ext-script').value = item ? (item.startScript || 'start.bat') : 'start.bat';
  document.getElementById('ext-url').value = item ? (item.url || '') : '';
  document.getElementById('ext-inline-script').value = item ? (item.script || '') : '';
  document.getElementById('ext-desc').value = item ? (item.description || '') : '';
  extFormMsg.textContent = '';
  extFormMsg.className = 'ext-form-msg';
  extForm.classList.add('open');
  document.getElementById('ext-name').focus();
}

document.getElementById('cp-add').addEventListener('click', () => openExtForm(null));
document.getElementById('ext-form-cancel').addEventListener('click', closeExtForm);
document.getElementById('cp-close').addEventListener('click', closeConfigPanel);
configPanelMask.addEventListener('click', e => { if (e.target === configPanelMask) closeConfigPanel(); });

document.getElementById('ext-form-save').addEventListener('click', async () => {
  const name = document.getElementById('ext-name').value.trim();
  const p = document.getElementById('ext-path').value.trim();
  if (!name) { extFormMsg.textContent = '名称不能为空'; return; }
  if (!p) { extFormMsg.textContent = '路径不能为空'; return; }
  const payload = {
    name,
    icon: document.getElementById('ext-icon').value.trim() || '📦',
    path: p,
    startScript: document.getElementById('ext-script').value.trim() || 'start.bat',
    script: document.getElementById('ext-inline-script').value,
    url: document.getElementById('ext-url').value.trim(),
    description: document.getElementById('ext-desc').value.trim(),
  };
  extFormMsg.textContent = '保存中…';
  try {
    if (editingExtId) {
      await api(`/api/external-services/${encodeURIComponent(editingExtId)}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
      });
    } else {
      await api('/api/external-services', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
      });
    }
    closeExtForm();
    await loadExtServices();
    await probeServices();
  } catch (err) {
    extFormMsg.textContent = '保存失败：' + err.message;
  }
});

/* ---------- 事件 ---------- */
search.addEventListener('input', renderGrid);

tagsBar.addEventListener('click', e => {
  const tagEl = e.target.closest('.tag');
  if (!tagEl) return;
  activeTag = tagEl.dataset.tag;
  renderTags();
  renderGrid();
});

refreshBtn.addEventListener('click', async () => {
  refreshBtn.disabled = true;
  refreshBtn.textContent = '↻ 刷新中…';
  await init();
  refreshBtn.textContent = '↻ 刷新';
  refreshBtn.disabled = false;
});

probeBtn.addEventListener('click', probeServices);

/* ---------- 数据加载 ---------- */
async function loadProjects() {
  grid.innerHTML = `<div class="loading"><span class="spinner"></span>正在扫描 projects 目录…</div>`;
  try {
    const data = await api('/api/projects');
    projects = data.projects || [];
  } catch (err) {
    projects = [];
    grid.innerHTML = `<div class="empty">⚠️ 加载失败：${escapeHtml(String(err.message || err))}</div>`;
  }
  renderTags();
  renderGrid();
}

function updateCountInfo() {
  countInfo.textContent = `${projects.length} 个应用 · ${services.length} 个服务`;
}

// 统一初始化：每次刷新页面都走这里，确保 projects 和 services 同时加载
async function init() {
  svcGrid.innerHTML = `<div class="loading"><span class="spinner"></span>正在加载服务…</div>`;
  grid.innerHTML = `<div class="loading"><span class="spinner"></span>正在扫描 projects 目录…</div>`;

  const [projResult, svcResult] = await Promise.allSettled([
    api('/api/projects'),
    api('/api/services'),
  ]);

  if (projResult.status === 'fulfilled') {
    projects = projResult.value.projects || [];
  } else {
    projects = [];
    grid.innerHTML = `<div class="empty">⚠️ 加载失败：${escapeHtml(String(projResult.reason?.message || projResult.reason))}</div>`;
  }

  if (svcResult.status === 'fulfilled') {
    services = svcResult.value.services || [];
  } else {
    services = [];
    svcGrid.innerHTML = `<div class="empty">⚠️ 探测失败：${escapeHtml(String(svcResult.reason?.message || svcResult.reason))}</div>`;
  }

  renderTags();
  renderGrid();
  renderServices();
  updateCountInfo();
}

init();
