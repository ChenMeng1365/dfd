<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄钟</title>
<style>
  :root { --accent: #e05252; --break: #3da06b; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #faf7f2; color: #2b2b2b;
  }
  .card {
    text-align: center; padding: 44px 54px;
    background: #fff; border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.10);
  }
  .mode { font-size: 15px; letter-spacing: 4px; color: #999; margin-bottom: 6px; }
  .mode.work { color: var(--accent); }
  .mode.break { color: var(--break); }
  .time { font-size: 84px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 8px 0 18px; }
  .controls { display: flex; gap: 12px; justify-content: center; }
  button {
    font-size: 15px; padding: 10px 26px; border-radius: 999px;
    border: 0; cursor: pointer; background: #eee; color: #2b2b2b;
    transition: all .15s;
  }
  button:hover { filter: brightness(0.94); }
  button.primary { background: var(--accent); color: #fff; }
  .cycles { margin-top: 18px; font-size: 13px; color: #999; }
</style>
</head>
<body>
  <div class="card">
    <div class="mode work" id="mode">专注</div>
    <div class="time" id="time">25:00</div>
    <div class="controls">
      <button id="toggle" class="primary">开始</button>
      <button id="reset">重置</button>
    </div>
    <div class="cycles" id="cycles">今日完成 0 个番茄</div>
  </div>

<script>
'use strict';
const WORK = 25 * 60, BREAK = 5 * 60;
let remaining = WORK;
let timer = null;
let running = false;
let done = 0;

const modeEl = document.getElementById('mode');
const timeEl = document.getElementById('time');
const toggleEl = document.getElementById('toggle');
const cyclesEl = document.getElementById('cycles');

function render() {
  const m = String(Math.floor(remaining / 60)).padStart(2, '0');
  const s = String(remaining % 60).padStart(2, '0');
  timeEl.textContent = m + ':' + s;
  toggleEl.textContent = running ? '暂停' : '开始';
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.start(); osc.stop(ctx.currentTime + 0.4);
  } catch (_) { /* 忽略音频环境阻塞 */ }
}

function switchPhase(toWork) {
  clearInterval(timer);
  timer = null;
  running = false;
  remaining = toWork ? WORK : BREAK;
  modeEl.textContent = toWork ? '专注' : '休息';
  modeEl.className = 'mode ' + (toWork ? 'work' : 'break');
  toggleEl.className = 'primary' + (toWork ? '' : '');
  render();
}

toggleEl.addEventListener('click', () => {
  if (running) {
    clearInterval(timer);
    timer = null;
    running = false;
    render();
    return;
  }
  running = true;
  render();
  timer = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      beep();
      clearInterval(timer);
      timer = null;
      running = false;
      if (modeEl.textContent === '专注') {
        done++;
        cyclesEl.textContent = '今日完成 ' + done + ' 个番茄';
        switchPhase(false);
      } else {
        switchPhase(true);
      }
    }
    render();
  }, 1000);
});

document.getElementById('reset').addEventListener('click', () => {
  clearInterval(timer);
  timer = null;
  running = false;
  switchPhase(true);
  render();
});

render();
</script>
</body>
</html>
